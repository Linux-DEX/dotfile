palette = "accent"

[palettes.accent]
purple = "#5d3fd3"
violet = "#5e1ef5"

format = """
$directory$git_branch$git_commit$git_state$git_metrics$git_status$docker_context$nodejs$python$golang$rust$aws$cmd_duration$jobs$line_break$character"""

[hostname]
ssh_only = true
format = '[ ](bold violet) '
trim_at = "."
disabled = false

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[✘](bold red)"

[directory]
read_only = " "
truncation_length = 10
truncate_to_repo = true
truncation_symbol = "…/"
style = "bold italic blue"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[cmd_duration]
min_time = 2000
show_milliseconds = false
disabled = false
style = "bold italic red"

[jobs]
symbol = "✦ "
style = "bold violet"

[aws]
symbol = "  "

[docker_context]
symbol = " "
format = "» [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
disabled = false

[git_branch]
symbol = " "

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = false

[git_status]
conflicted = " "
ahead = "󱡮 ×${count} "
behind = "󰴻 ×${count} "
diverged = "󱡷  󱡮  ×${ahead_count} 󰴻 ×${behind_count} "
untracked = "󰈛 ×${count} "
stashed = " "
modified = " ×${count} "
staged = " ×${count} "
renamed = "󰑕 ×${count} "
deleted = "󰆴 ×${count} "
style = "bold purple"
format = "$all_status$ahead_behind"

[golang]
symbol = " "
style = "bold blue"
format = "» [$symbol$version]($style) "

[nodejs]
symbol = " "
format = "» [$symbol$version](bold green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[python]
symbol = " "
format = '» [${symbol}${pyenv_prefix}(${virtualenv}) $version]($style) '
style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["python", "python3"]

[rust]
symbol = " "
format = "» [$symbol$version]($style) "

[package]
disabled = true

# Unused in this setup — skip prompt scans
[conda]
disabled = true

[dart]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[hg_branch]
disabled = true

[java]
disabled = true

[julia]
disabled = true

[memory_usage]
disabled = true

[nim]
disabled = true

[nix_shell]
disabled = true

[perl]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[scala]
disabled = true

[swift]
disabled = true
