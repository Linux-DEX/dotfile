bind ^X lock-server
bind ^D detach
bind S choose-session
bind C-c list-clients
bind C-o rotate-window
bind O rotate-window -D

bind c new-window -c "#{pane_current_path}"
bind , command-prompt -p "rename window" "rename-window '%%%'"
bind r source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind w list-windows
bind ^W list-windows
bind '"' choose-window

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z
# P rebound in tmux.conf to command palette; toggle border status with Prefix+_
bind _ set pane-border-status
bind * setw synchronize-panes
bind -r -T prefix [ resize-pane -L 10
bind -r -T prefix ] resize-pane -R 10
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7

bind ^L refresh-client
bind : command-prompt
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind p previous-window
bind n next-window
bind m break-pane
bind M command-prompt -F -p "move to session" "move-window -t '%1:'; switch-client -t '%1:#{window_id}'"
bind @ command-prompt -p "join into window" "join-pane -t ':%1'; select-window -t ':%1'"
bind '{' swap-pane -U
bind '}' swap-pane -D

# Spatial pane swap (TUIOS-style); skip floating / edge so missing neighbors stay silent
bind -r H { if -F '#{||:#{pane_floating_flag},#{pane_at_left}}' { } { swap-pane -s '{left-of}' } }
bind -r J { if -F '#{||:#{pane_floating_flag},#{pane_at_bottom}}' { } { swap-pane -s '{down-of}' } }
bind -r K { if -F '#{||:#{pane_floating_flag},#{pane_at_top}}' { } { swap-pane -s '{up-of}' } }
bind -r L { if -F '#{||:#{pane_floating_flag},#{pane_at_right}}' { } { swap-pane -s '{right-of}' } }

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

bind N command-prompt -p "rename session" "rename-session '%%%'"
bind b set-option status \; display-message "Status Bar: #{?status,on,off}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind C-n command-prompt -p "new session" "new-session -s '%%%'"
bind C-t display-popup -d "#{pane_current_path}" -w 75% -h 85% -E "zsh"
bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  ".zshrc"            z  "display-popup -E -w 75% -h 85% 'nvim ~/dotfile/.zshrc'" \
  ".tmux.conf"        t  "display-popup -E -w 75% -h 85% 'nvim ~/dotfile/.config/tmux/tmux.conf'" \
  "Daily Note"        n  "display-popup -E -w 75% -h 85% 'sh -c \"mkdir -p ~/Documents/NOTES/Daily && FILE=~/Documents/NOTES/Daily/\$(date +%F).md && touch \\\"\\\$FILE\\\" && nvim \\\"\\\$FILE\\\"\"'" \
  "Todo"              o  "display-popup -E -w 75% -h 85% 'sh -c \"mkdir -p ~/Documents/NOTES && FILE=~/Documents/NOTES/todo.md && touch \\\"\\\$FILE\\\" && nvim \\\"\\\$FILE\\\"\"'" \
  "btop"              b  "display-popup -E -w 90% -h 90% 'btop'" \
  "Exit"              q  ""

bind C-e choose-tree -Zs -O name -f '#{?session_attached,0,1}'
bind C-f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-window |\
    cut -d ' ' -f 1 |\
    xargs tmux select-window -t"
bind C-k set -g status-position top
bind C-j set -g status-position bottom

bind Space display-menu -T "#[align=centre] Layouts " -x C -y C \
  "Even Horizontal"  h  "select-layout even-horizontal" \
  "Even Vertical"    v  "select-layout even-vertical" \
  "Main Horizontal"  H  "select-layout main-horizontal" \
  "Main Vertical"    V  "select-layout main-vertical" \
  "Tiled Grid"       t  "select-layout tiled" \
  "" \
  "Exit"             q  ""
bind g display-menu -T "#[align=centre] Git & Projects " -x C -y C \
  "LazyGit (Popup)"      g  "display-popup -d '#{pane_current_path}' -w 85% -h 85% -E 'lazygit'" \
  "Hunk Diff Viewer"     s  "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'hunk diff'" \
  "Hunk Last Commit"     c  "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'hunk show'" \
  "" \
  "Exit"                 q  ""
bind W display-menu -T "#[align=centre] Workspaces " -x C -y C \
  "IDE Mode (Main-V)"  i  "select-layout main-vertical; resize-pane -R 20" \
  "3-Pane Stack"       s  "split-window -h -c '#{pane_current_path}'; split-window -v -c '#{pane_current_path}'; select-layout main-vertical" \
  "Quad Grid (4 Panes)" q  "split-window -h -c '#{pane_current_path}'; split-window -v -c '#{pane_current_path}'; split-window -v -c '#{pane_current_path}'; select-layout tiled" \
  "Kill All Other Panes" x "kill-pane -a" \
  "" \
  "Exit"               e  ""

bind ? display-popup -w 60% -h 70% -E "\
    tmux list-keys |\
    grep -v 'copy-mode' |\
    fzf --reverse --header 'Tmux Keybindings Cheat Sheet' --query=''"
bind B display-popup -E -w 90% -h 90% -T " Kabmat " "kabmat"
bind Tab switch-client -l
bind X confirm-before -p "Kill window #W? (y/n)" kill-window
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session
