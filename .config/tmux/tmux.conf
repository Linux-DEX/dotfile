source-file ~/.config/tmux/tmux.reset.conf

set -g cursor-style bar
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setqc=\E[11::%p1%d;%p2%s\E\\'
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g mouse on
unbind C-b
set -g prefix ^A
bind ^A send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
setw -g mode-keys vi

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @sessionx-bind 'o'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#1e1e2e"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[fg=#{@thm_teal}] #{b:pane_current_path} "
set -ga status-right "#[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_blue}]󰃭 %d-%m-%Y "
set -ga status-right "#[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_lavender}] %I:%M %p "

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_blue}]  #S │}}"
set -ga status-left "#{?pane_synchronized,#[bg=#{@thm_bg}]#[fg=#{@thm_red}]#[bold] sync │,}"

set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format " #I#{?#{!=:#{window_name},Window}, #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g status-justify left
set -g window-status-current-format " #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍉,} "
set -g window-status-current-style "bg=#{@thm_bg},fg=#{@thm_peach},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm'

set -g display-time 2000
set -gF message-style "fg=#{@thm_blue},bg=#{@thm_bg},fill=#{@thm_bg}"
set -gF message-command-style "fg=#{@thm_blue},bg=#{@thm_bg},fill=#{@thm_bg}"
set -gF pane-border-style "fg=#{@thm_overlay_0}"
# Active border: scratch=yellow, float=cyan/teal, else peach
set -g pane-active-border-style "fg=#{?#{==:#{pane_title},scratch},#{@thm_yellow},#{?pane_floating_flag,#{@thm_teal},#{@thm_peach}}}"
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{?#{==:#{pane_title},scratch},#[fg=#{@thm_yellow} bold]SCRATCH#[default] ,#{?pane_floating_flag,#[fg=#{@thm_teal}]float#[default] ,}} #{pane_current_command} "
set -gF pane-status-style "fg=#{@thm_overlay_0}"
set -gF pane-status-current-style "fg=#{@thm_peach}"
set -g pane-border-type separate
set -g pane-border-lines rounded

# Hint HUD in copy mode (Linux-DEX)
set -g copy-mode-position-format "#[align=right]#{?hint_active,#[fg=#{@thm_bg},bg=#{@thm_yellow} bold] HINT #{hint_count} — type label #[default] ,}[#{copy_position}/#{copy_position_limit}]"

# --- Linux-DEX feature binds (prefix is C-a) ---
# Prefix+P = command palette; Prefix+C-b = cycle border type (B stays kabmat)
bind -N 'Command palette' P {
	new-pane -E -x75% -y40% -X0 -Y0
	move-pane -P bottom-centre
	switch-mode -Ck
}
bind -N 'Cycle pane border type' C-b {
	if -F '#{==:#{pane-border-type},separate}' {
		set -w pane-border-type separate-active
		display-message 'pane-border-type separate-active'
	} {
		if -F '#{==:#{pane-border-type},separate-active}' {
			set -w pane-border-type joined
			display-message 'pane-border-type joined'
		} {
			set -w pane-border-type separate
			display-message 'pane-border-type separate'
		}
	}
}
# Scratch / hint / layout (built into this fork; defaults also bind these)
bind -N 'Toggle floating scratch pane' u { toggle-scratch }
bind -N 'Hint-jump URLs and paths' F {
	copy-mode
	send -X hint
	command-prompt -p 'hint:' { send -X hint-select -- '%%' }
}
bind -N 'Hint-jump and open' M-f {
	copy-mode
	send -X hint
	command-prompt -p 'open:' { send -X hint-select -o -- '%%' }
}
bind -N 'Save session layouts' C-s { save-layout }
bind -N 'Load session layouts' C-r { load-layout }
# Fuzzy pickers (sessionx still on o; these are native switch-mode)
bind -N 'Fuzzy session picker' S {
	new-pane -E -x80% -y50% -X0 -Y0
	move-pane -P bottom-centre
	switch-mode -sk
}
bind -N 'Switch to a window' Tab {
	new-pane -E -x75% -y45% -X0 -Y0
	move-pane -P bottom-centre
	switch-mode -wk
}
# Grouped cheatsheet (overrides plain list-keys)
bind -N 'Key cheatsheet' ? {
	display-menu -xR -yP -T '#[align=centre]Linux-DEX keys' \
		'Panes >' p {
			display-menu -xR -yP -T '#[align=centre]Panes' \
				'Focus hjkl' '' {} \
				'Swap HJKL' '' {} \
				'Float / tile  @' '@' { if -F '#{pane_floating_flag}' { join-pane } { break-pane -W } } \
				'New float     *' '*' { new-pane } \
				'Scratch       u' 'u' { toggle-scratch } \
				'Zoom          z' 'z' { resize-pane -Z }
		} \
		'Sessions >' s {
			display-menu -xR -yP -T '#[align=centre]Sessions' \
				'Fuzzy sessions  S' 'S' {
					new-pane -E -x80% -y50% -X0 -Y0
					move-pane -P bottom-centre
					switch-mode -sk
				} \
				'Fuzzy windows   Tab' 'Tab' {
					new-pane -E -x75% -y45% -X0 -Y0
					move-pane -P bottom-centre
					switch-mode -wk
				} \
				'Command palette P' 'P' {
					new-pane -E -x75% -y40% -X0 -Y0
					move-pane -P bottom-centre
					switch-mode -Ck
				} \
				'Sessionx        o' 'o' { }
		} \
		'Layout >' l {
			display-menu -xR -yP -T '#[align=centre]Layout' \
				'Save layout   C-s' 'C-s' { save-layout } \
				'Load layout   C-r' 'C-r' { load-layout } \
				'Upgrade server' '' { upgrade-server }
		} \
		'Copy >' c {
			display-menu -xR -yP -T '#[align=centre]Copy' \
				'Copy mode     [' '[' { copy-mode } \
				'Hint-jump     F' 'F' {
					copy-mode
					send -X hint
					command-prompt -p 'hint:' { send -X hint-select -- '%%' }
				} \
				'Hint-open   M-f' 'M-f' {
					copy-mode
					send -X hint
					command-prompt -p 'open:' { send -X hint-select -o -- '%%' }
				} \
				'Paste         ]' ']' { paste-buffer -p }
		} \
		'' \
		'All annotated keys' '?' { list-keys -N } \
		'Describe a key' '/' { command-prompt -kpkey { list-keys -1N '%%' } }
}
set -gF copy-mode-match-style "bg=#{@thm_green},fg=#{@thm_bg}"
set -gF copy-mode-current-match-style "bg=#{@thm_peach},fg=#{@thm_bg}"
set -gF copy-mode-selection-style "bg=#{@thm_blue},fg=#{@thm_bg}"
set -gF display-panes-colour "#{@thm_overlay_0}"
set -gF display-panes-active-colour "#{@thm_peach}"
set -g display-panes-time 2000
set -g menu-border-lines rounded
# popup-* options exist on tmux 3.8; next-3.9 draws popups as floating panes
if-shell -b 'tmux set -g popup-border-lines rounded >/dev/null 2>&1' '' ''
if-shell -b 'tmux set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}" >/dev/null 2>&1' '' ''
if-shell -b 'tmux set -gF popup-border-style "bg=#{@thm_bg},fg=#{@thm_blue}" >/dev/null 2>&1' '' ''
set -gF menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF menu-selected-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"
set -gF menu-border-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g tree-mode-border-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@thm_red},#{@thm_blue}}"
