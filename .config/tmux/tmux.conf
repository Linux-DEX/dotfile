source-file ~/.config/tmux/tmux.reset.conf

set -g cursor-style bar
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setqc=\E[11::%p1%d;%p2%s\E\\'
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g mouse on
unbind C-b
set -g prefix ^A
bind ^A send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
setw -g mode-keys vi

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @sessionx-bind 'o'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#1e1e2e"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[fg=#{@thm_teal}] #{b:pane_current_path} "
set -ga status-right "#[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_blue}]󰃭 %d-%m-%Y "
set -ga status-right "#[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_lavender}] %I:%M %p "

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_blue}]  #S │}}"
set -ga status-left "#{?pane_synchronized,#[bg=#{@thm_bg}]#[fg=#{@thm_red}]#[bold] sync │,}"

set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format " #I#{?#{!=:#{window_name},Window}, #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g status-justify left
set -g window-status-current-format " #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍉,} "
set -g window-status-current-style "bg=#{@thm_bg},fg=#{@thm_peach},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm'

set -g display-time 2000
set -gF message-style "fg=#{@thm_blue},bg=#{@thm_bg},fill=#{@thm_bg}"
set -gF message-command-style "fg=#{@thm_blue},bg=#{@thm_bg},fill=#{@thm_bg}"
set -gF pane-border-style "fg=#{@thm_overlay_0}"
set -gF pane-active-border-style "fg=#{@thm_peach}"
set -gF copy-mode-match-style "bg=#{@thm_green},fg=#{@thm_bg}"
set -gF copy-mode-current-match-style "bg=#{@thm_peach},fg=#{@thm_bg}"
set -gF copy-mode-selection-style "bg=#{@thm_blue},fg=#{@thm_bg}"
set -gF display-panes-colour "#{@thm_overlay_0}"
set -gF display-panes-active-colour "#{@thm_peach}"
set -g display-panes-time 2000
set -g popup-border-lines rounded
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -gF menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF menu-selected-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"
set -gF menu-border-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g tree-mode-border-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@thm_red},#{@thm_blue}}"
